[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fde-workbench"
version = "0.2.0"
description = "Evidence-led problem design, concise briefs, and portable agent skills."
readme = "docs/package/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "daehuikim" }]
keywords = ["fde", "design", "agents", "skills", "decision-support"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
fde = "fde_workbench.cli:main"

[project.urls]
Homepage = "https://github.com/daehuikim/fde-service-template"
Documentation = "https://github.com/daehuikim/fde-service-template/blob/main/docs/en/guide.md"
Repository = "https://github.com/daehuikim/fde-service-template"
Issues = "https://github.com/daehuikim/fde-service-template/issues"
Changelog = "https://github.com/daehuikim/fde-service-template/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3", "build==1.3.0", "twine==6.2.0", "pyyaml==6.0.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/fde_workbench"]

[tool.hatch.build.targets.sdist]
include = ["/src/fde_workbench", "/tests", "/pyproject.toml", "/docs/package/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
