services:
  edge:
    image: caddy:2.10.2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      APP_MODE: live
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set a random token of at least 32 bytes}
      SERVICE_TENANT: ${SERVICE_TENANT:-demo}
      DATABASE_URL: ${DATABASE_URL:?use the non-superuser runtime DB role}
    expose: ["3000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set admin password}
      POSTGRES_DB: fde
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
