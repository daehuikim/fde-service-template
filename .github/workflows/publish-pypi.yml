name: publish-pypi
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Reviewed release tag, for example v0.2.0'
        type: string
        required: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fde-workbench/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.17
      - run: uv sync --frozen
      - name: Verify release tag
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: uv run python -c "import os; from fde_workbench import __version__; assert os.environ['RELEASE_REF'] == 'v' + __version__"
      - run: uv run pytest
      - run: uv build
      - run: uv run twine check dist/*
      - run: uv run python scripts/package-smoke.py
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
