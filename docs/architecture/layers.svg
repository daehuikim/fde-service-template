height="100" rx="10" fill="white" stroke="#2866de"/><text x="295" y="372" class="small">packages/tools</text><text x="295" y="409" class="body">Next.js API · 세션 쿠키 / bearer</text><text x="595" y="409" class="body">requirePermission · CSRF · 입력 한도</text><text x="895" y="409" class="body">취소 · evidence · timeout 한도</text></g><g id="layer-04"><rect x="28" y="464" width="230" height="100" rx="10" fill="#5743db"/><text x="46" y="498" font-size="18" font-weight="700" fill="white">04 판단 · 도메인</text><text x="46" y="525" font-size="12" fill="white">결정적인 업무 규칙</text><rect x="274" y="464" width="938" height="100" rx="10" fill="white" stroke="#5743db"/><text x="295" y="492" class="small">packages/domain</text><text x="295" y="529" class="body">중복 · 부서 · 금액 검증</text><text x="595" y="529" class="body">상태 전이 invariant</text><text x="895" y="529" class="body">LLM 없는 핵심 경로</text></g><g id="layer-05"><rect x="28" y="584" width="230" height="100" rx="10" fill="#c6780c"/><text x="46" y="618" font-size="18" font-weight="700" fill="white">05 영속 · 격리</text><text x="46" y="645" font-size="12" fill="white">트랜잭션과 tenant 경계</text><rect x="274" y="584" width="938" height="100" rx="10" fill="white" stroke="#c6780c"/><text x="295" y="612" class="small">packages/db</text><text x="295" y="649" class="body">PostgreSQL · 32 테이블 · RLS</text><text x="595" y="649" class="body">RBAC · 감사 로그 · outbox · version</text><text x="895" y="649" class="body">체크섬 ledger migration · 제약 조건</text></g><g id="layer-06"><rect x="28" y="704" width="230" height="100" rx="10" fill="#ce4266"/><text x="46" y="738" font-size="18" font-weight="700" fill="white">06 검증 · 작업 도구</text><text x="46" y="765" font-size="12" fill="white">품질을 반복 검증</text><rect x="274" y="704" width="938" height="100" rx="10" fill="white" stroke="#ce4266"/><text x="295" y="732" class="small">qa</text><text x="295" y="769" class="body">37+ 자동 테스트 · 합성 평가</text><text x="595" y="769" class="body">프로젝트 skills · 선택형 MCP</text><text x="895" y="769" class="body">사람 관찰 · baseline 기록</text></g><g id="layer-07"><rect x="28" y="824" width="230" height="100" rx="10" fill="#4c617a"/><text x="46" y="858" font-size="18" font-weight="700" fill="white">07 배포 · 운영</text><text x="46" y="885" font-size="12" fill="white">같은 앱을 환경에 맞게 운영</text><rect x="274" y="824" width="938" height="100" rx="10" fill="white" stroke="#4c617a"/><text x="295" y="852" class="small">deploy</text><text x="295" y="889" class="body">Compose · 단일 호스트</text><text x="595" y="889" class="body">K8s · 다중 replica 설계안</text><text x="895" y="889" class="body">TLS · secret · backup · rollback</text></g><text x="30" y="975" class="small">합성 예제 · monorepo / 확장 방향과 실제 구현 범위는 architecture.spec.json 및 ADR 참조</text></svg>