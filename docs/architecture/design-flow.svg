<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="430" viewBox="0 0 1240 430" role="img"><title>문제에서 설계까지 · 방법은 근거로 선택</title><style>text{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif} .title{font-size:27px;font-weight:700;fill:#17283a}.sub{font-size:13px;fill:#647687}.name{font-size:17px;font-weight:700}.body{font-size:13px;fill:#4b6071}.small{font-size:11px;fill:#6c7b88}</style><rect width="100%" height="100%" fill="#f8fafc"/><text x="32" y="45" class="title">문제에서 설계까지 · 방법은 근거로 선택</text><text x="32" y="73" class="sub">이 흐름은 질문의 순서입니다. 특정 제품/ontology/LLM/framework를 강제하지 않습니다.</text><g id="design-problem"><rect x="28" y="125" width="218" height="140" rx="12" fill="white" stroke="#89a195"/><text x="44" y="160" class="name" fill="#264b38">문제 · 현재 업무</text><text x="44" y="192" class="body">누가 어떤 결정을 바꾸는가</text><text x="44" y="230" font-size="9" fill="#61786a">docs/problem-brief.md</text></g><path d="M249 192 H267" stroke="#557565"/><path d="M261 188 L267 192 L261 196" fill="none" stroke="#557565"/><g id="design-evidence"><rect x="271" y="125" width="218" height="140" rx="12" fill="white" stroke="#89a195"/><text x="287" y="160" class="name" fill="#264b38">자료 · 불확실성</text><text x="287" y="192" class="body">관측 / 업체주장 / 가정 구분</text><text x="287" y="230" font-size="9" fill="#61786a">designs</text></g><path d="M492 192 H510" stroke="#557565"/><path d="M504 188 L510 192 L504 196" fill="none" stroke="#557565"/><g id="design-methods"><rect x="514" y="125" width="218" height="140" rx="12" fill="white" stroke="#89a195"/><text x="530" y="160" class="name" fill="#264b38">서로 다른 대안</text><text x="530" y="192" class="body">시트 · SQL · 모델 · 사람</text><text x="530" y="230" font-size="9" fill="#61786a">docs/design-playbook.md</text></g><path d="M735 192 H753" stroke="#557565"/><path d="M747 188 L753 192 L747 196" fill="none" stroke="#557565"/><g id="design-choice"><rect x="757" y="125" width="218" height="140" rx="12" fill="white" stroke="#89a195"/><text x="773" y="160" class="name" fill="#264b38">선택 · 변경 조건</text><text x="773" y="192" class="body">적합 / 실패 조건 · 기각 이유</text><text x="773" y="230" font-size="9" fill="#61786a">packages/contracts/design.schema.json</text></g><path d="M978 192 H996" stroke="#557565"/><path d="M990 188 L996 192 L990 196" fill="none" stroke="#557565"/><g id="design-handoff"><rect x="1000" y="125" width="218" height="140" rx="12" fill="white" stroke="#89a195"/><text x="1016" y="160" class="name" fill="#264b38">설계 · 검증 인계</text><text x="1016" y="192" class="body">계약 · 오류 · 배포 · 운영</text><text x="1016" y="230" font-size="9" fill="#61786a">scripts/design-check.mjs</text></g><rect x="28" y="300" width="1184" height="80" rx="10" fill="#eaf0e7"/><text x="48" y="331" class="body">정량: 근거/요구/시나리오 연결 · 설계 반례 / 정성: 대안 적합성 · 가정 영향 · 다음 관찰</text><text x="48" y="359" class="small">자동 pass는 문서 구조만 뜻합니다. 독립 전문가 검토와 실제 사용자 가치는 별도 검증합니다.</text></svg>