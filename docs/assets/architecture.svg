<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title"><title id="title">FDE Workbench architecture — host assistant, offline Python core, reports, bundles and portable skills</title><style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Menlo,'Courier New',monospace}</style><rect x="0" y="0" width="1280" height="800" rx="18" fill="#f8fbfc" stroke="none" /><text x="56" y="62" fill="#102d38" font-size="34" font-weight="700" letter-spacing="-1">One design record. Three ways to ship.</text><text x="56" y="96" fill="#647f89" font-size="17" font-weight="400" >Your assistant reasons. The Python core checks and packages the result.</text><text x="56" y="151" fill="#6d8993" font-size="11" font-weight="700" letter-spacing="1.5">HOST ASSISTANT</text><rect x="56" y="179" width="244" height="314" rx="14" fill="#102b38" stroke="none" /><g transform="translate(80,203) scale(0.7727272727272727)"><path d="M0 0H44V44H0Z" fill="#8de5ce"/><path d="M12 11H33V17H19V22H29V28H19V35H12Z" fill="#0b222c"/></g><text x="80" y="277" fill="#eff8fa" font-size="23" font-weight="700" >Research</text><text x="80" y="317" fill="#eff8fa" font-size="23" font-weight="700" >Compare</text><text x="80" y="357" fill="#eff8fa" font-size="23" font-weight="700" >Critique</text><text x="80" y="404" fill="#a9c8d1" font-size="13" font-weight="400" >Uses your chosen models,</text><text x="80" y="427" fill="#a9c8d1" font-size="13" font-weight="400" >tools and permissions.</text><text x="80" y="467" fill="#8de5ce" font-size="11" font-weight="600" class="mono">SKILL.md</text><path d="M304 326H398" stroke="#b8c9ce" stroke-width="1.5" /><path d="M392 322L398 326L392 330" stroke="#b8c9ce" fill="none" stroke-width="1.5"/><text x="314" y="308" fill="#5f7b85" font-size="11" font-weight="400" class="mono">design.json</text><rect x="408" y="151" width="450" height="387" rx="14" fill="white" stroke="#8cb6b6" /><text x="432" y="185" fill="#2b7e