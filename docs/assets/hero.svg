<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title"><title id="title">FDE Workbench — evidence-led problem design, Python CLI, SDK and portable agent skill</title><style>text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Menlo,'Courier New',monospace}</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1b28"/><stop offset="1" stop-color="#122e36"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a9dbdb" stroke-opacity=".035"/></pattern></defs><rect x="0" y="0" width="1280" height="720" rx="20" fill="url(#bg)" stroke="none" /><rect x="0" y="0" width="1280" height="720" rx="20" fill="url(#grid)" stroke="none" /><g transform="translate(64,58) scale(1)"><path d="M0 0H44V44H0Z" fill="#8de5ce"/><path d="M12 11H33V17H19V22H29V28H19V35H12Z" fill="#0b222c"/></g><text x="124" y="88" fill="#edf8f7" font-size="21" font-weight="700" letter-spacing="2">FDE WORKBENCH</text><text x="64" y="170" fill="#8de5ce" font-size="11" font-weight="700" letter-spacing="1.7">FROM FIELD PROBLEM TO BUILDABLE DECISION</text><text x="60" y="244" fill="#f6fafb" font-size="56" font-weight="700" letter-spacing="-2">Think it through.</text><text x="60" y="308" fill="#8de5ce" font-size="56" font-weight="700" letter-spacing="-2">Then build it right.</text><text x="64" y="366" fill="#b6cbd2" font-size="20" font-weight="400" >A workbench for evidence, tradeoffs,</text><text x="64" y="397" fill="#b6cbd2" font-size="20" font-weight="400" >and designs your team can actually use.</text><rect x="64" y="447" width="510" height="144" rx="10" fill="#091a26" stroke="#29434e" /><text x="84" y="477" fill="#6f939f" font-size="10" font-weight="700" letter-spacing="1.5">QUICK START</text><text x="84" y="510" fill="#c6e8df" font-size="12" font-weight="400" class="mono">$ fde example support-triage --output demo</text><text x="84" y="537" fill="#c6e8df" font-size="12" font-weight="400" class="mono">$ fde check demo</text><text x="84" y="564" fill="#8de5ce" font-size="11" font-weight="400" class="mono">PASS  ·  reviewable evidence, explicit tradeoffs</text><rect x="670" y="111" width="546" height="481" rx="16" fill="#132d38" stroke="#35525d" /><rect x="690" y="131" width="506" height="441" rx="10" fill="#f8fbfb" stroke="none" /><text x="718" y="166" fill="#627d85" font-size="10" font-weight="700" letter-spacing="1.7">DECISION RECORD</text><rect x="1060" y="149" width="108" height="24" rx="12" fill="#e0f2eb" stroke="none" /><text x="1074" y="165" fill="#117e6a" font-size="9" font-weight="700" >REVIEW READY</text><text x="718" y="210" fill="#102d38" font-size="27" font-weight="700" letter-spacing="-.6">Maintenance triage</text><text x="718" y="240" fill="#66818a" font-size="13" font-weight="400" >Choose the simplest approach the evidence supports.</text><rect x="718" y="265" width="450" height="92" rx="9" fill="#eaf2ef" stroke="#d3e5df" /><text x="736" y="290" fill="#5a8177" font-size="9" font-weight="700" letter-spacing="1">SELECTED APPROACH</text><text x="736" y="320" fill="#176952" font-size="20" font-weight="700" >Rules + owner lookup</text><text x="736" y="342" fill="#54766d" font-size="11" font-weight="400" >Keep human approval. Revisit when ambiguity grows.</text><text x="718" y="392" fill="#288874" font-size="12" font-weight="700" class="mono">01</text><text x="751" y="392" fill="#244752" font-size="14" font-weight="600" >Compare meaningful alternatives</text><text x="718" y="426" fill="#288874" font-size="12" font-weight="700" class="mono">02</text><text x="751" y="426" fill="#244752" font-size="14" font-weight="600" >Make assumptions and counterarguments explicit</text><text x="718" y="460" fill="#288874" font-size="12" font-weight="700" class="mono">03</text><text x="751" y="460" fill="#244752" font-size="14" font-weight="600" >Deliver a concise brief and a portable report</text><path d="M718 491H1168" stroke="#dce6e8"/><text x="718" y="522" fill="#4d6c78" font-size="11" font-weight="600" class="mono">BRIEF.md</text><text x="843" y="522" fill="#4d6c78" font-size="11" font-weight="600" class="mono">REPORT.html</text><text x="992" y="522" fill="#4d6c78" font-size="11" font-weight="600" class="mono">handoff.zip</text><path d="M64 629H1216" stroke="#2c4853"/><text x="64" y="668" fill="#87a9b4" font-size="11" font-weight="700" letter-spacing="1">PYTHON CLI + SDK</text><text x="369" y="668" fill="#87a9b4" font-size="11" font-weight="700" letter-spacing="1">PORTABLE AGENT SKILL</text><text x="764" y="668" fill="#87a9b4" font-size="11" font-weight="700" letter-spacing="1">ENGLISH / 한국어</text><text x="1093" y="668" fill="#87a9b4" font-size="11" font-weight="700" letter-spacing="1">MIT LICENSE</text></svg>